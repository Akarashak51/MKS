<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CELERIS AUTOMOBILI — Demand Intelligence & Planning Control Tower</title>
<style>
  :root[data-theme="dark"] {
    --bg: #050505; --bg-grid: rgba(255,255,255,0.03); --surface: #0e0e10; --surface-2: #17171b;
    --surface-hover: #202026; --border: #26262c; --border-strong: #3a3a44; --text: #fafaf9;
    --text-soft: #d6d3d1; --muted: #9a9691; --pink: #ff2e88; --orange: #ff6b2b; --red: #ff3b4e;
    --yellow: #ffd12e; --shadow: 0 14px 34px rgba(0,0,0,0.65); --glow-pink: rgba(255,46,136,0.22);
    --glow-orange: rgba(255,107,43,0.22); --chart-grid: #24242a; --chart-hist: #e7e5e4;
    --chart-ship: #78716c; --chart-band: rgba(255,107,43,0.22); --chart-fc-zone: rgba(255,46,136,0.06);
    --table-head: #121215; --pill-req-bg: rgba(255,46,136,0.16); --pill-req-fg: #ff6aa8;
    --pill-opt-bg: rgba(255,209,46,0.16); --pill-opt-fg: #ffd12e;
  }
  :root[data-theme="light"] {
    --bg: #e7e4dc; --bg-grid: rgba(10,10,12,0.04); --surface: #f5f3ed; --surface-2: #dedad0;
    --surface-hover: #d4cfc3; --border: #c9c4b8; --border-strong: #a8a296; --text: #0a0a0c;
    --text-soft: #292524; --muted: #57534e; --pink: #d81b60; --orange: #d94e0f; --red: #c81e2b;
    --yellow: #b45309; --shadow: 0 12px 28px rgba(15,12,8,0.09); --glow-pink: rgba(216,27,96,0.14);
    --glow-orange: rgba(217,78,15,0.14); --chart-grid: #d4cfc4; --chart-hist: #1c1917;
    --chart-ship: #78716c; --chart-band: rgba(217,78,15,0.22); --chart-fc-zone: rgba(216,27,96,0.06);
    --table-head: #e2dfd6; --pill-req-bg: rgba(216,27,96,0.14); --pill-req-fg: #b0124d;
    --pill-opt-bg: rgba(180,83,9,0.14); --pill-opt-fg: #92400e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg); background-image: radial-gradient(var(--bg-grid) 1px, transparent 1px);
    background-size: 22px 22px; color: var(--text); min-height: 100vh; font-size: 13.5px; line-height: 1.5;
    transition: background-color 0.3s ease, color 0.3s ease; overflow-x: hidden;
  }
  .top-shell { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border); }
  .masthead { max-width: 1560px; margin: 0 auto; padding: 12px 22px 10px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .brand-lockup { display: flex; align-items: center; gap: 12px; }
  .brand-emblem { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--pink), var(--orange) 58%, var(--yellow)); display: grid; place-items: center; font-weight: 900; font-size: 17px; color: #050505; letter-spacing: -1px; box-shadow: 0 6px 18px var(--glow-pink); animation: emblemFloat 5s ease-in-out infinite; }
  @keyframes emblemFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .brand-text h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .brand-text p { font-size: 11px; color: var(--muted); letter-spacing: 0.4px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); animation: pulseDot 2s infinite; display: inline-block; }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(255,107,43,0.7); } 70% { box-shadow: 0 0 0 8px rgba(255,107,43,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,43,0); } }
  .masthead-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .part-switch { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .part-btn { border: none; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease; }
  .part-btn:hover { color: var(--text); }
  .part-btn.active { background: linear-gradient(90deg, var(--pink), var(--orange)); color: #fff; box-shadow: 0 3px 12px var(--glow-pink); }
  .theme-toggle { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
  .theme-toggle:hover { border-color: var(--pink); box-shadow: 0 0 0 3px var(--glow-pink); transform: translateY(-1px); }
  .theme-swatch { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, var(--yellow), var(--orange), var(--pink)); }
  .nav-ribbon-wrap { border-top: 1px solid var(--border); background: var(--surface); }
  .nav-ribbon { max-width: 1560px; margin: 0 auto; padding: 8px 22px; display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: thin; }
  .nav-pill { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; background: transparent; border: 1px solid transparent; color: var(--text-soft); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
  .nav-pill:hover { background: var(--surface-2); color: var(--text); transform: translateY(-1px); }
  .nav-pill.active { background: linear-gradient(135deg, var(--pink), var(--orange)); color: #fff; box-shadow: 0 5px 16px var(--glow-pink); }
  .nav-pill.hidden-part { display: none; }
  .tag-mini { font-size: 9.5px; font-weight: 800; padding: 1.5px 5px; border-radius: 4px; }
  .tag-mini.req { background: var(--pill-req-bg); color: var(--pill-req-fg); }
  .tag-mini.opt { background: var(--pill-opt-bg); color: var(--pill-opt-fg); }
  .nav-pill.active .tag-mini { background: rgba(0,0,0,0.28); color: #fff; }
  .filter-deck { max-width: 1560px; margin: 0 auto; padding: 10px 22px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; border-top: 1px solid var(--border); }
  .f-field { display: flex; flex-direction: column; gap: 3px; flex: 1 1 155px; min-width: 140px; max-width: 240px; }
  .f-field label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
  select { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  select:focus, select:hover { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--glow-orange); }
  .btn-reset { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; height: 33px; transition: all 0.2s ease; }
  .btn-reset:hover { background: var(--red); color: #fff; border-color: var(--red); }
  .filter-status { margin-left: auto; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .f-chip { background: var(--pill-req-bg); color: var(--pill-req-fg); padding: 3px 9px; border-radius: 999px; font-weight: 700; font-size: 11px; }
  .workspace { max-width: 1560px; margin: 0 auto; padding: 22px 22px 54px; display: flex; flex-direction: column; gap: 18px; }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .anim-in { opacity: 0; animation: fadeSlideUp 0.45s cubic-bezier(0.22,1,0.36,1) forwards; }
  .d1 { animation-delay: 0.04s; } .d2 { animation-delay: 0.10s; } .d3 { animation-delay: 0.16s; } .d4 { animation-delay: 0.22s; } .d5 { animation-delay: 0.28s; }
  .hero-band { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
  .hero-band .kicker { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.4px; color: var(--pink); margin-bottom: 4px; }
  .hero-band h2 { font-size: clamp(20px, 2.3vw, 28px); font-weight: 800; letter-spacing: -0.4px; }
  .hero-band .sub { color: var(--muted); font-size: 13px; max-width: 740px; }
  .narrative-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--orange); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start; }
  .narrative-card h4 { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--orange); margin-bottom: 6px; }
  .narrative-card p { font-size: 13.5px; color: var(--text-soft); line-height: 1.62; }
  .narrative-card b { color: var(--text); }
  .narrative-bullets { list-style: none; display: flex; flex-direction: column; gap: 7px; border-left: 1px solid var(--border); padding-left: 16px; }
  .narrative-bullets li { font-size: 12.5px; color: var(--text-soft); position: relative; padding-left: 14px; }
  .narrative-bullets li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 13px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; position: relative; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.22s, border-color 0.22s; }
  .kpi::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--pink), var(--orange), var(--yellow)); opacity: 0.8; }
  .kpi:hover { transform: translateY(-3px); border-color: var(--orange); }
  .kpi .lbl { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .kpi .val { font-size: 24px; font-weight: 800; margin-top: 7px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .kpi .val.pink { color: var(--pink); } .kpi .val.orange { color: var(--orange); } .kpi .val.yellow { color: var(--yellow); } .kpi .val.red { color: var(--red); }
  .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .card-head h3 { font-size: 15px; font-weight: 800; }
  .card-head .note { font-size: 11.5px; color: var(--muted); }
  .card-caption { font-size: 12.5px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .table-wrap { overflow-x: auto; max-height: 430px; overflow-y: auto; border: 1px solid var(--border); border-radius: 9px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { position: sticky; top: 0; z-index: 2; background: var(--table-head); color: var(--muted); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; padding: 10px 11px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 9px 11px; border-bottom: 1px solid var(--border); color: var(--text-soft); vertical-align: top; }
  td b { color: var(--text); }
  td code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--surface-2); color: var(--text); padding: 2px 6px; border-radius: 4px; }
  tr:hover td { background: var(--surface-hover); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .pill.red { background: rgba(255,59,78,0.16); color: var(--red); } .pill.orange { background: rgba(255,107,43,0.16); color: var(--orange); }
  .pill.yellow { background: rgba(255,209,46,0.18); color: var(--yellow); } .pill.pink { background: var(--pill-req-bg); color: var(--pill-req-fg); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bar-lbl { width: 165px; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--surface-2); height: 14px; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--orange), var(--yellow)); transition: width 0.65s ease; }
  .bar-val { width: 115px; text-align: right; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart-wrap { position: relative; width: 100%; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .svg-line-anim { stroke-dasharray: 2800; stroke-dashoffset: 2800; animation: drawLine 1.1s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes drawLine { to { stroke-dashoffset: 0; } }
  .chart-tooltip { position: fixed; pointer-events: none; z-index: 100; background: var(--surface); color: var(--text); border: 1px solid var(--pink); border-radius: 9px; padding: 9px 12px; font-size: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); display: none; min-width: 175px; }
  .chart-tooltip .tt-title { font-weight: 800; color: var(--orange); margin-bottom: 4px; font-size: 12.5px; }
  .chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; margin-top: 2px; }
  .slider-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .slider-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; }
  .slider-box label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; margin-bottom: 9px; }
  .slider-box b { color: var(--pink); }
  input[type="range"] { width: 100%; accent-color: var(--orange); cursor: pointer; }
  .hm-cell { text-align: center; font-weight: 800; font-size: 11.5px; border-radius: 6px; padding: 7px 4px; transition: transform 0.15s; }
  .hm-cell:hover { transform: scale(1.06); }
  .dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
  .dl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); transition: transform 0.2s, border-color 0.2s; }
  .dl-card:hover { transform: translateY(-3px); border-color: var(--pink); }
  .dl-btn { margin-top: auto; display: inline-block; text-align: center; background: linear-gradient(90deg, var(--pink), var(--orange)); color: #fff; font-weight: 800; text-decoration: none; padding: 9px 14px; border-radius: 8px; font-size: 12.5px; }
  .loading-shell { padding: 54px 20px; text-align: center; color: var(--orange); font-weight: 700; }
  @media (max-width: 960px) { .narrative-card { grid-template-columns: 1fr; } .narrative-bullets { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 12px; } .grid-2 { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .masthead, .nav-ribbon, .filter-deck, .workspace { padding-left: 14px; padding-right: 14px; } .f-field { max-width: 100%; } }
</style>
</head>

<div class="top-shell">
  <div class="masthead">
    <div class="brand-lockup">
      <div class="brand-emblem">CA</div>
      <div class="brand-text">
        <h1>Celeris Automobili <span class="live-dot" title="Live pipeline outputs connected"></span></h1>

  </div>
  <div class="nav-ribbon-wrap">
    <nav class="nav-ribbon" id="nav-ribbon">
      <button class="nav-pill active" data-view="overview" data-part="both">1. Executive Overview <span class="tag-mini req">REQ</span></button>
      <button class="nav-pill" data-view="data-health" data-part="train">2. Data Health <span class="tag-mini req">REQ</span></button>
      <button class="nav-pill" data-view="demand-explorer" data-part="train">3. Demand Explorer <span class="tag-mini req">REQ</span></button>
      <button class="nav-pill" data-view="anomalies" data-part="train">4. Anomaly Monitor <span class="tag-mini req">REQ</span></button>
      <button class="nav-pill" data-view="stockouts" data-part="train">5. Stockouts &amp; Lost Sales <span class="tag-mini opt">OPT</span></button>
      <button class="nav-pill" data-view="macro-drivers" data-part="train">6. Macro Lead/Lag &amp; EV <span class="tag-mini opt">OPT</span></button>

<main class="workspace" id="view-root"><div class="loading-shell">Initializing Celeris Planning Control Tower...</div></main>
<div class="chart-tooltip" id="chart-tooltip"></div>

<script>
const FAM_PREFIX = {
  'Brake & Safety Systems': 'BSS-', 'Chassis & Structural': 'CSS-', 'Electrical Assemblies': 'ELA-',
  'Hydraulic Systems': 'HYD-', 'Powertrain Components': 'PTC-', 'Precision Machined Parts': 'PMP-', 'Thermal Management': 'THM-'
};
const state = { view: 'overview', partFilter: 'all', family: 'ALL', sku: 'ALL', region: 'ALL', channel: 'ALL', customer: 'ALL', meta: null, whatIf: { pmi: -3, auto: 0, ev: 0, price: 0 } };
const fmtNum = v => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
const fmtDec = (v, d = 2) => v == null ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtUSD = v => {
  if (v == null) return '—';
  const n = Number(v);
  if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
};
function qs(extra = {}) { return new URLSearchParams({ family: state.family, sku: state.sku, region: state.region, channel: state.channel, customer: state.customer, ...extra }).toString(); }
async function api(path, extra = {}) { return await (await fetch(path + '?' + qs(extra))).json(); }
function scopeLabel() {
  const parts = [];
  if (state.family !== 'ALL') parts.push(state.family);
  if (state.sku !== 'ALL') parts.push(state.sku);
  if (state.region !== 'ALL') parts.push(state.region);
  if (state.channel !== 'ALL') parts.push(state.channel);
  if (state.customer !== 'ALL') parts.push(state.customer);
  return parts.length ? parts.join(' · ') : 'Global Portfolio (All 7 Families · 6 Regions · 12 Customers)';
}
function updateFilterChips() {
  const box = document.getElementById('filter-status');
  const active = [];
  if (state.family !== 'ALL') active.push('Family: ' + state.family);
  if (state.sku !== 'ALL') active.push('SKU: ' + state.sku);
  if (state.region !== 'ALL') active.push('Region: ' + state.region);
  if (state.channel !== 'ALL') active.push('Channel: ' + state.channel);

function bindChartTooltips(container) {
  container.querySelectorAll('[data-tt]').forEach(el => {

function renderBars(items, gradient = '') {

}

function renderContinuousSVG(timeline, mode = 'units') {
  if (!timeline || !timeline.length) return '<p style="color:var(--muted)">No timeline data.</p>';
  const W = 1040, H = 300, padL = 74, padR = 24, padT = 20, padB = 36, plotW = W - padL - padR, plotH = H - padT - padB;
  const n = timeline.length, xOf = i => padL + (i / Math.max(1, n - 1)) * plotW;
  const vals = [];
  timeline.forEach(d => {
    if (mode === 'units') { if (d.unconstrained != null) vals.push(d.unconstrained); if (d.shipped != null) vals.push(d.shipped); if (d.p90 != null) vals.push(d.p90); if (d.p50 != null) vals.push(d.p50); }
    else { if (d.revenue != null) vals.push(d.revenue); if (d.rev_p50 != null) vals.push(d.rev_p50); }
  });
  const maxY = Math.max(...vals, 1) * 1.1, yOf = v => padT + plotH - (v / maxY) * plotH;
  const splitIdx = timeline.findIndex(d => d.phase === 'forecast'), splitX = splitIdx >= 0 ? xOf(splitIdx) : W - padR;
  const linePath = g => { const pts = []; timeline.forEach((d, i) => { const v = g(d); if (v != null) pts.push(`${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`); }); return pts.length ? 'M' + pts.join(' L') : ''; };
  let bridgePath = '';
  if (splitIdx > 0) {
    const p = timeline[splitIdx - 1], c = timeline[splitIdx];
    const v1 = mode === 'units' ? p.unconstrained : p.revenue, v2 = mode === 'units' ? c.p50 : c.rev_p50;
    if (v1 != null && v2 != null) bridgePath = `M${xOf(splitIdx - 1).toFixed(1)},${yOf(v1).toFixed(1)} L${xOf(splitIdx).toFixed(1)},${yOf(v2).toFixed(1)}`;
  }
  let bandPoly = '';
  if (mode === 'units' && splitIdx >= 0) {
    const up = [], lo = [];
    timeline.forEach((d, i) => { if (d.p90 != null && d.p10 != null) { up.push(`${xOf(i).toFixed(1)},${yOf(d.p90).toFixed(1)}`); lo.unshift(`${xOf(i).toFixed(1)},${yOf(d.p10).toFixed(1)}`); } });
    if (up.length) bandPoly = `<polygon points="${up.concat(lo).join(' ')}" fill="var(--chart-band)" />`;
  }
  let yGrid = '';
  for (let k = 0; k <= 4; k++) { const gv = (maxY * k) / 4, gy = yOf(gv); yGrid += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--chart-grid)" stroke-dasharray="3,3"/><text x="${padL-8}" y="${gy+4}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="end">${mode==='units'?fmtNum(gv):fmtUSD(gv)}</text>`; }
  let xTicks = ''; const step = Math.max(1, Math.floor(n / 10));
  for (let i = 0; i < n; i += step) xTicks += `<text x="${xOf(i)}" y="${H-10}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="middle">${timeline[i].date}</text>`;
  const stripW = plotW / Math.max(1, n);
  const hits = timeline.map((d, i) => {
    const rows = d.phase === 'history'
      ? (mode === 'units' ? [['Unconstrained Demand', fmtNum(d.unconstrained)], ['Clean Shipped', fmtNum(d.shipped)]] : [['Historical Revenue', fmtUSD(d.revenue)]])
      : (mode === 'units' ? [['Forecast P50', fmtNum(d.p50)], ['Calibrated P10', fmtNum(d.p10)], ['Calibrated P90', fmtNum(d.p90)]] : [['Forecast Revenue P50', fmtUSD(d.rev_p50)]]);
    return `<rect x="${(xOf(i)-stripW/2).toFixed(1)}" y="${padT}" width="${Math.max(6,stripW).toFixed(1)}" height="${plotH}" fill="transparent" data-tt="${encodeURIComponent(JSON.stringify({title:`${d.date} (${d.phase})`,rows}))}" style="cursor:crosshair"/>`;
  }).join('');
  return `<div class="legend"><span class="legend-item"><i class="swatch" style="background:var(--chart-hist)"></i>${mode==='units'?'Unconstrained History':'Historical Revenue'}</span>${mode==='units'?'<span class="legend-item"><i class="swatch" style="background:var(--chart-ship);height:2px"></i>Actual Shipped</span>':''}<span class="legend-item"><i class="swatch" style="background:var(--pink)"></i>Forecast P50 (2026-11 → 2028-05)</span>${mode==='units'?'<span class="legend-item"><i class="swatch" style="background:var(--orange);height:10px;opacity:0.45"></i>Calibrated P10–P90 Band</span>':''}</div><div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:320px;">${splitIdx>=0?`<rect x="${splitX}" y="${padT}" width="${W-padR-splitX}" height="${plotH}" fill="var(--chart-fc-zone)"/>`:''}${yGrid}${xTicks}${bandPoly}${mode==='units'?`<path d="${linePath(d=>d.shipped)}" fill="none" stroke="var(--chart-ship)" stroke-width="1.4" stroke-dasharray="4,3"/>`:''}<path class="svg-line-anim" d="${linePath(d=>mode==='units'?d.unconstrained:d.revenue)}" fill="none" stroke="var(--chart-hist)" stroke-width="2.2"/>${bridgePath?`<path d="${bridgePath}" fill="none" stroke="var(--pink)" stroke-width="2.2" stroke-dasharray="4,3"/>`:''}<path class="svg-line-anim" d="${linePath(d=>mode==='units'?d.p50:d.rev_p50)}" fill="none" stroke="var(--pink)" stroke-width="2.8"/>${splitIdx>=0?`<line x1="${splitX}" y1="${padT}" x2="${splitX}" y2="${H-padB}" stroke="var(--yellow)" stroke-width="1.8" stroke-dasharray="5,4"/><text x="${splitX+7}" y="${padT+13}" fill="var(--yellow)" font-size="11.5" font-weight="800">FORECAST START · 2026-11</text>`:''}${hits}</svg></div>`;
}

function renderMultiLineSVG(rows, xKey, seriesDefs) {
  if (!rows || !rows.length) return '<p style="color:var(--muted)">No data.</p>';
  const W = 960, H = 255, padL = 66, padR = 22, padT = 18, padB = 34, plotW = W - padL - padR, plotH = H - padT - padB;
  const n = rows.length, xOf = i => padL + (i / Math.max(1, n - 1)) * plotW;
  let maxY = 1; rows.forEach(r => seriesDefs.forEach(s => { if (r[s.key] != null) maxY = Math.max(maxY, Number(r[s.key])); })); maxY *= 1.12;
  const yOf = v => padT + plotH - (v / maxY) * plotH;
  let grid = '';
  for (let k = 0; k <= 4; k++) { const gv = (maxY * k) / 4; grid += `<line x1="${padL}" y1="${yOf(gv)}" x2="${W-padR}" y2="${yOf(gv)}" stroke="var(--chart-grid)" stroke-dasharray="3,3"/><text x="${padL-8}" y="${yOf(gv)+4}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="end">${fmtNum(gv)}</text>`; }
  const step = Math.max(1, Math.floor(n / 9)); let xt = '';
  for (let i = 0; i < n; i += step) xt += `<text x="${xOf(i)}" y="${H-9}" fill="var(--muted)" font-size="11" font-weight="600" text-anchor="middle">${rows[i][xKey]}</text>`;
  const paths = seriesDefs.map(s => `<path class="svg-line-anim" d="M${rows.map((r,i)=>`${xOf(i).toFixed(1)},${yOf(Number(r[s.key]||0)).toFixed(1)}`).join(' L')}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.5}" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`).join('');
  const stripW = plotW / Math.max(1, n);
  const hits = rows.map((r, i) => `<rect x="${(xOf(i)-stripW/2).toFixed(1)}" y="${padT}" width="${Math.max(8,stripW).toFixed(1)}" height="${plotH}" fill="transparent" data-tt="${encodeURIComponent(JSON.stringify({title:String(r[xKey]),rows:seriesDefs.map(s=>[s.label,fmtDec(r[s.key]||0,s.dec??0)])}))}" style="cursor:crosshair"/>`).join('');
  return `<div class="legend">${seriesDefs.map(s=>`<span class="legend-item"><i class="swatch" style="background:${s.color}"></i>${s.label}</span>`).join('')}</div><div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:270px;">${grid}${xt}${paths}${hits}</svg></div>`;
}

function narrativeBlock(title, paragraph, bullets) {
  return `<section class="narrative-card anim-in d1"><div><h4>${title}</h4><p>${paragraph}</p></div><ul class="narrative-bullets">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul></section>`;
}

      <div class="card anim-in d4"><div class="card-head"><h3>Monthly Baseline vs. Scenario Trajectory</h3></div>${renderMultiLineSVG(d.monthly, 'Date', [{ key: 'base_p50', label: 'Baseline P50', color: 'var(--muted)', dash: '4,3' }, { key: 'scen_p50', label: 'Scenario P50', color: 'var(--pink)' }])}</div>`;
    ['pmi','auto','ev','price'].forEach(k => { document.getElementById('sl-'+k).onchange = e => { state.whatIf[k] = Number(e.target.value); renderView(); }; });
  }
  else if (state.view === 'procurement') {
    const d = await api('/api/procurement');
    const bufPct = d.total_p50 > 0 ? ((d.total_safety_buffer / d.total_p50) * 100).toFixed(1) : '0.0';
    root.innerHTML = `
      <div class="hero-band anim-in"><div><div class="kicker">Part B · Calibrated Aggregate &amp; SKU Capacity Planning</div><h2>Procurement Plan from P90 Forecasts</h2></div><div class="sub">Calibration Level: <b>${d.interval_level.toUpperCase()}</b></div></div>
      ${narrativeBlock('Calibrated P90 Procurement Strategy', `Aggregate capacity for <b>${scope}</b> is sized using calibrated <b>${d.interval_level}-level P90 quantiles</b> (<b>${fmtNum(d.total_p90)} units</b>, +${bufPct}% safety buffer, <b>${fmtUSD(d.total_budget_p90)}</b>) rather than summing SKU-level P90s—preventing unrealistic over-buffering at portfolio level while still showing individual SKU-level P90 commitments in the table below.`, [`<b>Aggregate Safety Buffer:</b> +${fmtNum(d.total_safety_buffer)} units (+${bufPct}% above P50).`, `<b>SKU-Level Commitments:</b> Table ranks top 40 SKU-Region P90 buffers for supplier-level ordering.`])}
      <div class="kpi-grid anim-in d2">
        <div class="kpi"><div class="lbl">P50 Base Demand</div><div class="val">${fmtNum(d.total_p50)}</div></div>
        <div class="kpi"><div class="lbl">Portfolio P90 Capacity Target</div><div class="val pink">${fmtNum(d.total_p90)}</div><div class="sub">Calibrated at ${d.interval_level} level (not summed SKUs)</div></div>
        <div class="kpi"><div class="lbl">Portfolio Safety Buffer (P90 − P50)</div><div class="val orange">+${fmtNum(d.total_safety_buffer)}</div><div class="sub">+${bufPct}% aggregate plant buffer</div></div>
        <div class="kpi"><div class="lbl">Calibrated P90 Budget</div><div class="val yellow">${fmtUSD(d.total_budget_p90)}</div></div>
      </div>
      <div class="card anim-in d3"><div class="card-head"><h3>Monthly P50 vs. Calibrated P90 Schedule</h3></div>${renderMultiLineSVG(d.monthly, 'Date', [{ key: 'p90', label: 'Calibrated P90', color: 'var(--orange)' }, { key: 'p50', label: 'P50 Forecast', color: 'var(--pink)' }])}</div>
      <div class="card anim-in d4"><div class="card-head"><h3>Top 40 Individual SKU-Region Buffers (SKU-Level P90)</h3><span class="note">Individual SKU P90s sum to 4.42M globally because SKU spikes do not occur simultaneously; use Portfolio P90 (3.20M) for total plant capacity</span></div>
        <div class="table-wrap"><table><thead><tr><th>SKU</th><th>Family</th><th>Region</th><th class="num">P50 (19M)</th><th class="num">SKU P90 (19M)</th><th class="num">SKU Buffer</th><th class="num">P90 Value</th></tr></thead><tbody>
          ${d.top_skus.map(r=>`<tr><td><b>${r.SKU_ID}</b></td><td>${r.Product_Family}</td><td>${r.Region}</td><td class="num">${fmtNum(r.p50_19m)}</td><td class="num"><b>${fmtNum(r.p90_19m)}</b></td><td class="num">+${fmtNum(r.safety_buffer)}</td><td class="num"><b>${fmtUSD(r.budget_p90)}</b></td></tr>`).join('')}
        </tbody></table></div>
      </div>`;
  }
  else if (state.view === 'lifecycle') {
    const d = await api('/api/lifecycle');
    root.innerHTML = `
      <div class="hero-band anim-in"><div><div class="kicker">Part B · EOL &amp; Cold-Start Launches</div><h2>Lifecycle Manager</h2></div><div class="sub">Calibrated from 6 historical SKU replacements</div></div>
      <div class="grid-3 anim-in d2">
        ${d.active_transitions.map(p=>`<div class="card"><div class="card-head"><h3>${p.old_sku} → ${p.new_sku}</h3><span class="pill pink">${p.family}</span></div><p style="font-size:12px;color:var(--muted);margin-bottom:10px;">EOL: <b>${p.old_eol}</b> · Launch: <b>${p.new_launch}</b></p>${renderMultiLineSVG(p.timeline,'date',[{key:'old_units',label:p.old_sku+' (EOL)',color:'var(--red)'},{key:'new_units',label:p.new_sku+' (New)',color:'var(--orange)'}])}</div>`).join('')}
      </div>
      <div class="card anim-in d3"><div class="card-head"><h3>Master Lifecycle Registry</h3></div>
        <div class="table-wrap"><table><thead><tr><th>SKU</th><th>Family</th><th>Powertrain</th><th>Status</th><th>Launch</th><th>EOL</th><th>Replaces SKU</th></tr></thead><tbody>
          ${d.lifecycle_table.map(r=>`<tr><td><b>${r.SKU_ID}</b></td><td>${r.Product_Family}</td><td>${r.Powertrain_Application}</td><td><span class="pill ${r.Lifecycle_Status==='Planned Launch'?'orange':r.Lifecycle_Status==='EOL Announced'?'yellow':'red'}">${r.Lifecycle_Status}</span></td><td>${r.Launch_Date}</td><td>${r.EOL_Date||'—'}</td><td><b>${r.Replaces_SKU||'—'}</b></td></tr>`).join('')}
        </tbody></table></div>
      </div>`;
  }
  else if (state.view === 'exceptions') {
    const d = await api('/api/exceptions');
    root.innerHTML = `
      <div class="hero-band anim-in"><div><div class="kicker">Part B · Management by Exception</div><h2>Planner Exception Queue</h2></div><div class="sub">${fmtNum(d.total_exceptions)} prioritized exceptions</div></div>
      <div class="card anim-in d2"><div class="card-head"><h3>Prioritized Action Queue</h3></div>
        <div class="table-wrap"><table><thead><tr><th>Priority</th><th>SKU</th><th>Region</th><th>Family</th><th>Exception Type</th><th>Context</th><th>Detail</th><th>Action</th></tr></thead><tbody>
          ${d.exceptions.map(r=>`<tr><td><span class="pill ${r.Priority.startsWith('P1')?'red':'yellow'}">${r.Priority}</span></td><td><b>${r.SKU_ID}</b></td><td>${r.Region}</td><td>${r.Product_Family}</td><td><code>${r.Exception_Type}</code></td><td>${r.Date_Context}</td><td>${r.Detail}</td><td>${r.Action}</td></tr>`).join('')}
        </tbody></table></div>
      </div>`;
  }
  else if (state.view === 'downloads') {
    const files = [
      { f: 'submission.csv', title: 'Final 19-Month Submission (CSV)', desc: '58,219 non-negative integer rows matching test.csv 1-to-1.' },
      { f: 'anomaly_register.csv', title: 'Anomaly & Backorder Register (CSV)', desc: 'Full audited register separating ERP errors, backorder catch-ups, unrecorded stockouts, and real events.' },
      { f: 'data_quality_report.json', title: 'Data Quality Report (JSON)', desc: 'Dynamically computed before/after audit and reconciliation ledger.' },
      { f: 'backtest_metrics.json', title: '4-Origin Backtest & OOS Calibration (JSON)', desc: '4-origin WAPE/Bias, OOS P10–P90 coverage across hierarchy levels, and model-derived Ridge elasticities.' },
      { f: 'intermittency_profile.csv', title: 'Intermittency & Order Cycles (CSV)', desc: 'ADI, CV², SBC class, and detected ordering phase per SKU-Region.' },
      { f: 'macro_clean.csv', title: 'Cleaned Macro Indicators (CSV)', desc: '113 deduplicated, scale-fixed, interpolated monthly indicators.' }
    ];
    root.innerHTML = `
      <div class="hero-band anim-in"><div><div class="kicker">Part B · Exportable Artifacts</div><h2>Pipeline Outputs &amp; Downloads</h2></div></div>
      <div class="dl-grid anim-in d2">${files.map(x=>`<div class="dl-card"><h4>${x.title}</h4><p style="font-size:12.5px;color:var(--muted)">${x.desc}</p><a class="dl-btn" href="/api/download/${x.f}" download="${x.f}">Download ${x.f}</a></div>`).join('')}</div>`;
  }
  bindChartTooltips(root);
}

function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('celeris_theme', t); document.getElementById('theme-label').textContent = t === 'dark' ? 'Dark Black' : 'Dark White'; }
async function init() {
  applyTheme(localStorage.getItem('celeris_theme') || 'dark');
  document.getElementById('btn-theme').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  state.meta = await fetch('/api/meta').then(r => r.json());
  const fill = (id, arr) => { const el = document.getElementById(id); arr.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; el.appendChild(o); }); };
  fill('f-family', state.meta.families); fill('f-region', state.meta.regions); fill('f-channel', state.meta.channels); fill('f-customer', state.meta.customers);
  populateSkuOptions();
  document.getElementById('f-family').onchange = e => { state.family = e.target.value; populateSkuOptions(); renderView(); };
  ['sku','region','channel','customer'].forEach(k => { document.getElementById('f-'+k).onchange = e => { state[k] = e.target.value; renderView(); }; });
  document.getElementById('btn-reset').onclick = () => { ['family','sku','region','channel','customer'].forEach(k => { state[k] = 'ALL'; document.getElementById('f-'+k).value = 'ALL'; }); populateSkuOptions(); renderView(); };
  document.querySelectorAll('.part-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
      const part = btn.dataset.part; state.partFilter = part;
      const pills = document.querySelectorAll('.nav-pill'); let hidden = false;
      pills.forEach(p => { const show = part === 'all' || p.dataset.part === 'both' || p.dataset.part === part; p.classList.toggle('hidden-part', !show); if (!show && p.classList.contains('active')) hidden = true; });
      if (hidden) { const fv = Array.from(pills).find(p => !p.classList.contains('hidden-part')); if (fv) fv.click(); }
    };
  });
  document.querySelectorAll('.nav-pill').forEach(btn => {
    btn.onclick = () => { document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active')); btn.classList.add('active'); state.view = btn.dataset.view; renderView(); };
  });
  renderView();
}
init();
</script>
